services:
  loopline:
    build: .
    container_name: loopline-p2p
    environment:
      P2P_BIND_HOST: 0.0.0.0
      P2P_HTTP_PORT: 8787
      P2P_TRANSFER_PORT: 8788
      P2P_ALLOW_REMOTE: "1"
      P2P_RECEIVE_DIR: /data/received
      P2P_SENT_DIR: /data/sent
      P2P_SHARED_DIR: /data/shared
      P2P_SYNC_PEERS: ${P2P_SYNC_PEERS:-}
      P2P_ADVERTISED_HOST: ${P2P_ADVERTISED_HOST:-0.0.0.0}
    ports:
      - "8080:8080"
      - "8788:8788"
    volumes:
      - ./backend/received:/data/received
      - ./backend/sent:/data/sent
      - ./shared:/data/shared
      - ./backend/torrents:/data/torrents
    restart: unless-stopped
